[project]
name = "popsim"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pygame; python_version < '3.14'",
    "pygame-ce>=2.5.8; python_version >= '3.14'",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.uv]
package = false

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
